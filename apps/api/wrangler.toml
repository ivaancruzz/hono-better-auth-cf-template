name = "cloudflare-serverless-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
# Uncomment and set if `wrangler` can't auto-select an account (multiple
# accounts on your login) — or export CLOUDFLARE_ACCOUNT_ID instead.
# account_id = "REPLACE_ME_ACCOUNT_ID"

[vars]
LOG_LEVEL = "debug"
ENVIRONMENT = "development"

[observability]
enabled = true

[placement]
mode = "smart"

[[d1_databases]]
binding = "DATABASE"
database_name = "REPLACE_ME_DB_NAME"
database_id = "REPLACE_ME_DB_ID"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_ME_KV_ID"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "replace-me-bucket-name"

[images]
binding = "IMAGES"

# Después de crear los recursos reales (wrangler d1/kv/r2 create) y pegar los
# IDs arriba, correr `git update-index --assume-unchanged apps/api/wrangler.toml`
# para que git deje de trackear cambios locales a este archivo.
